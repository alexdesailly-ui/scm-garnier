# Configuration SonarQube / SonarCloud
# Prérequis (à faire une fois) :
#   1. Créer le projet sur SonarCloud (https://sonarcloud.io) ou votre SonarQube.
#   2. Ajouter le secret GitHub SONAR_TOKEN (et SONAR_HOST_URL si SonarQube auto-hébergé).
#   3. Renseigner sonar.organization ci-dessous si vous utilisez SonarCloud.

sonar.projectKey=alexdesailly-ui_scm-garnier
sonar.projectName=Cabinet Infirmier Garnier
# sonar.organization=votre-organisation-sonarcloud

# Code source analysé
sonar.sources=src,includes,admin,api,index.php,contact.php,prevention.php,rendez-vous.php,mentions-legales.php,setup.php,install.php,scripts
sonar.sourceEncoding=UTF-8

# Exclusions (dépendances, uploads, assets front)
sonar.exclusions=vendor/**,uploads/**,assets/**,migrations/**

# Import des rapports des autres outils (analyse croisée)
sonar.php.phpstan.reportPaths=build/phpstan-checkstyle.xml
