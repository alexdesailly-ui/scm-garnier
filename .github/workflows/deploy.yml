name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FTP_HOST: 145.79.20.5
  FTP_USER: u398408214
  REMOTE_DIR: /domains/scm-garnier-infirmier.fr/public_html

jobs:
  deploy:
    name: Deploy SCM Garnier to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: List remote, remove maintenance page, upload site
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          timeout 300 lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          cd $REMOTE_DIR
          echo ">>> AVANT - contenu de public_html :"
          cls -l
          echo ">>> Suppression des fichiers de maintenance (si presents) :"
          rm -f index.html
          rm -f index.htm
          rm -f maintenance.html
          rm -f maintenance.htm
          rm -f maintenance.php
          rm -f coming-soon.html
          rm -f .maintenance
          echo ">>> Upload du vrai site (sans effacer env.php ni uploads/) :"
          mirror --reverse --verbose --exclude-glob .git*/ --exclude-glob .git* --exclude-glob .github/ --exclude-glob docs/ --exclude-glob uploads/ --exclude-glob env.php --exclude-glob env.example.php --exclude-glob .env.deploy --exclude-glob preview.html --exclude-glob maintenance.html --exclude-glob scripts/setup-secrets.sh ./ $REMOTE_DIR/
          echo ">>> APRES - contenu de public_html :"
          cls -l
          bye
          LFTP
