name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy SCM Garnier to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List public_html BEFORE deploy
        run: |
          echo "Contenu de public_html avant déploiement :"
          curl -sS --ftp-ssl -k --list-only \
            "ftp://145.79.20.5/domains/scm-garnier-infirmier.fr/public_html/" \
            --user "u398408214:${{ secrets.FTP_PASS }}" || true

      - name: Remove maintenance placeholder files
        run: |
          BASE="ftp://145.79.20.5/domains/scm-garnier-infirmier.fr/public_html/"
          DIR="/domains/scm-garnier-infirmier.fr/public_html"
          for f in index.html index.htm maintenance.html maintenance.htm maintenance.php coming-soon.html .maintenance; do
            echo "Suppression de $f (si présent)..."
            curl -sS --ftp-ssl -k \
              --user "u398408214:${{ secrets.FTP_PASS }}" \
              -Q "DELE $DIR/$f" \
              "$BASE" && echo "  -> supprimé" || echo "  -> absent / ignoré"
          done

      - name: Clean non-production files
        run: |
          rm -rf docs/ .github/ scripts/setup-secrets.sh
          rm -f preview.html env.example.php .env.deploy maintenance.html

      - name: Deploy via FTP (no clean-slate, preserves env.php & uploads)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 145.79.20.5
          username: u398408214
          password: ${{ secrets.FTP_PASS }}
          server-dir: /domains/scm-garnier-infirmier.fr/public_html/
          port: 21
          protocol: ftps
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/docs/**
            **/.env.deploy
            **/env.php
            **/env.example.php
            **/preview.html
            **/maintenance.html
            **/uploads/**

      - name: List public_html AFTER deploy
        run: |
          echo "Contenu de public_html après déploiement :"
          curl -sS --ftp-ssl -k --list-only \
            "ftp://145.79.20.5/domains/scm-garnier-infirmier.fr/public_html/" \
            --user "u398408214:${{ secrets.FTP_PASS }}" || true
